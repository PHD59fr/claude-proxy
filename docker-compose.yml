# Initialize local configuration once: cp config.example.json config.json
services:
  claude-proxy:
    build:
      context: .
      args:
        VERSION: ${VERSION:?Run with VERSION=$(printf '%X' $(date +%s))}
    container_name: claude-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config.json:/app/config.json
      - claude-proxy-data:/tmp
    working_dir: /app
    environment:
      # Get a key from https://opencode.ai/auth (free models still require authentication).
      ZEN_API_KEY: ${ZEN_API_KEY:?Set ZEN_API_KEY to your OpenCode Zen key}

      # --- Logging ---
      LOG_LEVEL: info
      LOG_FORMAT: text
    healthcheck:
      test: ["CMD", "/app/claude-proxy", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  claude-proxy-data:
